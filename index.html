<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Before & After Slider</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #222;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  .wrap {
    width: min(1200px, 96vw);
  }
  .slider {
    position: relative;
    width: 100%;
    aspect-ratio: 1440 / 1080;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 12px 35px rgba(0,0,0,.35);
    background: #111;
    user-select: none;
    touch-action: none;
  }
  .slider img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .after { z-index: 1; }
  .before {
    z-index: 2;
    clip-path: inset(0 50% 0 0);
  }
  .handle {
    position: absolute;
    z-index: 4;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: white;
    box-shadow: 0 0 5px rgba(0,0,0,.5);
    cursor: ew-resize;
  }
  .handle::after {
    content: "↔";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #222;
    background: white;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .label {
    position: absolute;
    z-index: 5;
    top: 16px;
    padding: 7px 12px;
    color: white;
    background: rgba(0,0,0,.58);
    border-radius: 5px;
    font-weight: 700;
    letter-spacing: .03em;
  }
  .left { left: 16px; }
  .right { right: 16px; }
  input {
    position: absolute;
    inset: 0;
    z-index: 6;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: ew-resize;
    margin: 0;
  }
  .hint {
    color: #ddd;
    text-align: center;
    margin: 12px 0 0;
    font-size: 14px;
  }
</style>
</head>
